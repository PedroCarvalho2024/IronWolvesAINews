name: Submit a meme
description: Propose the IronWolves meme of the week
title: "[meme] "
labels: ["meme"]
body:
  - type: markdown
    attributes:
      value: |
        Drop your meme below. Paste or drag the image into the text box, GitHub will upload it.
        Keep it work-safe. The maintainer moves approved memes into the `memes/` folder.
  - type: textarea
    id: image
    attributes:
      label: Image
      description: Paste or drag the image here.
      placeholder: Drag the image into this box
    validations:
      required: true
  - type: input
    id: caption
    attributes:
      label: Caption
      description: One line shown under the meme.
      placeholder: When the retrieval pipeline returns the right chunk on the first try.
    validations:
      required: true
  - type: input
    id: week
    attributes:
      label: Week (optional)
      description: ISO week you want it featured, e.g. 2026-W40. Leave blank for the next free week.
